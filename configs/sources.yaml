download_dir: download
output_dir: dist
output_name: Superior-IP.mmdb
max_bytes: 1073741824   # 1 GiB
download_timeout_seconds: 900
download_retries: 3
download_concurrency: 6

sources:
  - id: ipinfo_lite
    enabled: true
    kind: mmdb
    url: "https://ipinfo.io/data/ipinfo_lite.mmdb?token=${IPINFO_TOKEN}"
    path: download/ipinfo_lite.mmdb
    license: "CC BY-SA 4.0"
    attribution: "This product includes IP data from IPinfo (https://ipinfo.io)."
    requires_env: [IPINFO_TOKEN]
    required: true

  - id: sapics_origin_asn
    enabled: true
    kind: mmdb
    url: "https://github.com/sapics/ip-location-db/releases/download/latest/origin-asn.mmdb"
    path: download/origin-asn.mmdb
    license: "PDDL"
    attribution: "ASN data from sapics/ip-location-db origin-asn (https://github.com/sapics/ip-location-db)."
    required: true

  - id: sapics_country
    enabled: true
    kind: mmdb
    url: "https://github.com/sapics/ip-location-db/releases/download/latest/user-country.mmdb"
    path: download/user-country.mmdb
    license: "PDDL"
    attribution: "Country data from sapics/ip-location-db user-country (https://github.com/sapics/ip-location-db)."
    required: true

  - id: iptoasn
    enabled: true
    kind: tsv_gz
    url: "https://iptoasn.com/data/ip2asn-combined.tsv.gz"
    path: download/ip2asn-combined.tsv.gz
    license: "Free (iptoasn.com)"
    attribution: "ASN/country ranges from IPtoASN (https://iptoasn.com/)."
    required: true

  - id: geolite2_asn
    enabled: true
    kind: maxmind_tar_gz
    url: "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz"
    path: download/GeoLite2-ASN.tar.gz
    extract_glob: "**/GeoLite2-ASN.mmdb"
    extract_to: download/GeoLite2-ASN.mmdb
    license: "CC BY-SA 4.0 + MaxMind GeoLite2 EULA"
    attribution: "This product includes GeoLite2 Data created by MaxMind, available from https://www.maxmind.com."
    requires_env: [MAXMIND_LICENSE_KEY]
    required: false

  - id: geolite2_city
    enabled: true
    kind: maxmind_tar_gz
    url: "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz"
    path: download/GeoLite2-City.tar.gz
    extract_glob: "**/GeoLite2-City.mmdb"
    extract_to: download/GeoLite2-City.mmdb
    license: "CC BY-SA 4.0 + MaxMind GeoLite2 EULA"
    attribution: "This product includes GeoLite2 Data created by MaxMind, available from https://www.maxmind.com."
    requires_env: [MAXMIND_LICENSE_KEY]
    required: false

  - id: dbip_city
    enabled: true
    kind: gzip
    url: "https://download.db-ip.com/free/dbip-city-lite-${YYYYMM}.mmdb.gz"
    path: download/dbip-city-lite.mmdb.gz
    extract_to: download/dbip-city-lite.mmdb
    license: "CC BY 4.0"
    attribution: "IP geolocation data from DB-IP (https://db-ip.com), licensed CC BY 4.0."
    required: true

  - id: ipapi_city_v4
    enabled: true
    kind: zip
    url: "https://ipapi.is/data/geolocationDatabaseIPv4.csv.zip"
    path: download/geolocationDatabaseIPv4.csv.zip
    extract_to: download/geolocationDatabaseIPv4.csv
    extract_glob: "*.csv"
    license: "Free download (ipapi.is)"
    attribution: "IP geolocation data from ipapi.is (https://ipapi.is/)."
    required: true

  - id: ipapi_city_v6
    enabled: true
    kind: zip
    url: "https://ipapi.is/data/geolocationDatabaseIPv6.csv.zip"
    path: download/geolocationDatabaseIPv6.csv.zip
    extract_to: download/geolocationDatabaseIPv6.csv
    extract_glob: "*.csv"
    license: "Free download (ipapi.is)"
    attribution: "IP geolocation data from ipapi.is (https://ipapi.is/)."
    required: true

  - id: openproxydb
    enabled: true
    kind: csv
    url: "https://github.com/NetworkCats/OpenProxyDB/releases/latest/download/proxy_blocks.csv"
    path: download/proxy_blocks.csv
    license: "CC0 1.0"
    attribution: "Privacy/hosting flags from OpenProxyDB (https://github.com/NetworkCats/OpenProxyDB)."
    required: true

  - id: aws_ranges
    enabled: true
    kind: json
    url: "https://ip-ranges.amazonaws.com/ip-ranges.json"
    path: download/aws-ip-ranges.json
    license: "Public"
    attribution: "AWS IP ranges from https://ip-ranges.amazonaws.com/ip-ranges.json."
    flags: { is_hosting_provider: true }
    required: true

  - id: gcp_ranges
    enabled: true
    kind: json
    url: "https://www.gstatic.com/ipranges/cloud.json"
    path: download/gcp-cloud.json
    license: "Public"
    attribution: "Google Cloud IP ranges from https://www.gstatic.com/ipranges/cloud.json."
    flags: { is_hosting_provider: true }
    required: true

  - id: azure_ranges
    enabled: true
    kind: azure_servicetags
    url: "https://www.microsoft.com/download/details.aspx?id=56519"
    path: download/azure-servicetags.json
    license: "Public"
    attribution: "Azure IP ranges from Microsoft Service Tags (download id 56519)."
    flags: { is_hosting_provider: true }
    required: false

  - id: cloudflare_v4
    enabled: true
    kind: lines
    url: "https://www.cloudflare.com/ips-v4"
    path: download/cloudflare-ips-v4.txt
    license: "Public"
    attribution: "Cloudflare IPv4 ranges from https://www.cloudflare.com/ips-v4."
    flags: { is_cdn: true, is_hosting_provider: true }
    required: true

  - id: cloudflare_v6
    enabled: true
    kind: lines
    url: "https://www.cloudflare.com/ips-v6"
    path: download/cloudflare-ips-v6.txt
    license: "Public"
    attribution: "Cloudflare IPv6 ranges from https://www.cloudflare.com/ips-v6."
    flags: { is_cdn: true, is_hosting_provider: true }
    required: true

  - id: tor_exits
    enabled: true
    kind: lines
    url: "https://check.torproject.org/torbulkexitlist"
    path: download/torbulkexitlist.txt
    license: "Public"
    attribution: "Tor exit nodes from https://check.torproject.org/torbulkexitlist."
    flags: { is_tor_exit_node: true, is_anonymous: true }
    required: false

  - id: icloud_relay
    enabled: true
    kind: csv
    url: "https://mask-api.icloud.com/egress-ip-ranges.csv"
    path: download/icloud-egress-ip-ranges.csv
    license: "Public"
    attribution: "iCloud Private Relay egress ranges from https://mask-api.icloud.com/egress-ip-ranges.csv."
    flags: { is_relay: true, is_anonymous: true }
    required: false

  - id: x4b_vpn
    enabled: true
    kind: lines
    url: "https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt"
    path: download/x4b-vpn-ipv4.txt
    license: "MIT"
    attribution: "VPN network list from X4BNet/lists_vpn (https://github.com/X4BNet/lists_vpn)."
    flags: { is_anonymous_vpn: true, is_anonymous: true }
    required: true

  - id: nordvpn
    enabled: true
    kind: nordvpn_json
    url: "https://api.nordvpn.com/v1/servers?limit=16384"
    path: download/nordvpn-servers.json
    license: "Public"
    attribution: "NordVPN server addresses from https://api.nordvpn.com/v1/servers."
    flags: { is_anonymous_vpn: true, is_anonymous: true }
    required: false

  - id: digitalocean_ranges
    enabled: true
    kind: csv
    url: "https://digitalocean.com/geo/google.csv"
    path: download/digitalocean-geo.csv
    license: "Public"
    attribution: "DigitalOcean IP ranges from https://digitalocean.com/geo/google.csv."
    flags: { is_hosting_provider: true }
    required: true

  - id: ovh_ranges
    enabled: true
    kind: ripe_announced
    url: "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS16276"
    path: download/ovh-as16276.json
    license: "Public"
    attribution: "OVHcloud announced prefixes via RIPEstat AS16276 (https://stat.ripe.net/)."
    flags: { is_hosting_provider: true }
    required: true

  - id: hetzner_ranges
    enabled: true
    kind: ripe_announced
    url: "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS24940"
    path: download/hetzner-as24940.json
    license: "Public"
    attribution: "Hetzner announced prefixes via RIPEstat AS24940 (https://stat.ripe.net/)."
    flags: { is_hosting_provider: true }
    required: true

  - id: peeringdb
    enabled: true
    kind: peeringdb_api
    url: "https://www.peeringdb.com/api/net"
    path: download/peeringdb-net.json
    license: "PeeringDB acceptable use (attribution)"
    attribution: "Inferred usage_type from PeeringDB network types (https://www.peeringdb.com/). Self-declared and incomplete; not commercial usage_type."
    required: false
